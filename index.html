<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="description" content="Portal do Aluno — CELINPB" />
  <title>Portal do Aluno — CELINPB</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Estilos (ordem importa) -->
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
</head>
<body>

  <!-- Splash de carregamento -->
  <div id="app-loading">
    <div class="loading-inner">
      <div class="loading-logo">
        <span class="logo-sigla">C</span>
      </div>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Container principal da SPA -->
  <div id="app" class="hidden">
    <header id="app-header" class="hidden"></header>
    <main   id="app-content"></main>
    <nav    id="app-nav"     class="hidden"></nav>
  </div>

  <!-- Toasts -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Scripts (ordem de dependência) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages.js"></script>
  <!-- Páginas de módulos (carregadas antes do router) -->
  <script src="pages/admin.js"></script>
  <script src="pages/avisos.js"></script>
  <script src="pages/calendario.js"></script>
  <script src="pages/turmas.js"></script>
  <script src="pages/documentos.js"></script>
  <script src="pages/rematricula.js"></script>
  <script src="pages/avaliacoes.js"></script>
  <script src="assets/js/router.js"></script>

</body>
</html>
